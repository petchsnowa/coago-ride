name: Production Hyperdrive connection
on:
  workflow_dispatch:
    inputs:
      project_confirmation:
        description: Enter coago-production to create or verify its Hyperdrive connection
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: coago-production-hyperdrive
  cancel-in-progress: false
jobs:
  connect:
    if: github.repository == 'petchsnowa/coago-ride' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Connect approved production database and verify remote read-only queries
        env:
          COAGO_DATABASE_TARGET: production
          COAGO_PROJECT_CONFIRMATION: ${{ inputs.project_confirmation }}
          COAGO_PRODUCTION_DATABASE_URL: ${{ secrets.COAGO_PRODUCTION_DATABASE_URL }}
          COAGO_PRODUCTION_DATABASE_HOST: ${{ vars.COAGO_PRODUCTION_DATABASE_HOST }}
          COAGO_PRODUCTION_DATABASE_NAME: ${{ vars.COAGO_PRODUCTION_DATABASE_NAME }}
          COAGO_PRODUCTION_HYPERDRIVE_ID: ${{ vars.COAGO_PRODUCTION_HYPERDRIVE_ID }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec tsx scripts/production/connect-hyperdrive.ts
