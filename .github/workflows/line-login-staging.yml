name: LINE Login staging
on:
  workflow_dispatch:
  push:
    branches: [codex/phase-2-line-login]
    paths:
      - .github/workflows/line-login-staging.yml
      - scripts/staging/**
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
permissions:
  contents: read
concurrency:
  group: coago-line-login-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'petchsnowa/coago-ride'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Deploy isolated COAGO Test login staging
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec tsx scripts/staging/deploy.ts
