name: Prepare production Worker
on:
  workflow_dispatch:
    inputs:
      project_confirmation:
        description: Enter coago-production to prepare the Worker (no domain changes)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: coago-production-worker
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'petchsnowa/coago-ride' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build production frontend and verify API bundle
        env:
          VITE_APP_MODE: production
          VITE_API_BASE_URL: ""
          WRANGLER_SEND_METRICS: "false"
        run: pnpm build
      - name: Prepare canonical-domain app on workers.dev without changing domain routes
        env:
          COAGO_DATABASE_TARGET: production
          COAGO_PROJECT_CONFIRMATION: ${{ inputs.project_confirmation }}
          COAGO_PRODUCTION_DATABASE_URL: ${{ secrets.COAGO_PRODUCTION_DATABASE_URL }}
          COAGO_PRODUCTION_DATABASE_HOST: ${{ vars.COAGO_PRODUCTION_DATABASE_HOST }}
          COAGO_PRODUCTION_DATABASE_NAME: ${{ vars.COAGO_PRODUCTION_DATABASE_NAME }}
          COAGO_PRODUCTION_HYPERDRIVE_ID: ${{ vars.COAGO_PRODUCTION_HYPERDRIVE_ID }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec tsx scripts/production/prepare-worker.ts
