name: Database readiness (read only)
on:
  push:
    branches: [codex/database-readiness]
    paths:
      - .github/workflows/database-readiness.yml
      - scripts/database-readiness/**
      - scripts/database-readiness.ts
      - scripts/staging/diagnose-bindings.ts
  workflow_dispatch:
    inputs:
      target:
        description: Database to inspect (no migrations or writes)
        type: choice
        options: [test, production]
        default: test
      project_confirmation:
        description: For production, enter coago-production after checking the Direct host in Neon
        type: string
        default: ""
permissions:
  contents: read
jobs:
  test-database:
    if: github.repository == 'petchsnowa/coago-ride' && (github.event_name == 'push' || inputs.target == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect direct test database using a read-only transaction
        env:
          COAGO_DATABASE_TARGET: test
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
        run: pnpm exec tsx scripts/database-readiness.ts
      - name: Inspect existing staging Worker and Hyperdrive metadata (GET only)
        if: success() || failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
        run: pnpm exec tsx scripts/staging/diagnose-bindings.ts
  production-database:
    if: github.repository == 'petchsnowa/coago-ride' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect production database without migrations or data writes
        env:
          COAGO_DATABASE_TARGET: production
          COAGO_PROJECT_CONFIRMATION: ${{ inputs.project_confirmation }}
          COAGO_PRODUCTION_DATABASE_URL: ${{ secrets.COAGO_PRODUCTION_DATABASE_URL }}
          COAGO_PRODUCTION_DATABASE_HOST: ${{ vars.COAGO_PRODUCTION_DATABASE_HOST }}
          COAGO_PRODUCTION_DATABASE_NAME: ${{ vars.COAGO_PRODUCTION_DATABASE_NAME }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
        run: pnpm exec tsx scripts/database-readiness.ts
