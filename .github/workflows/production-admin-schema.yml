name: Root Admin schema upgrade
on:
  workflow_dispatch:
    inputs:
      operation:
        description: check reads metadata; upgrade applies Root Admin migration
        type: choice
        options: [check, upgrade]
        default: check
      project_confirmation:
        description: Enter coago-production after checking the selected database
        type: string
        required: true
      allow_existing_data:
        description: Only enable after reviewing backup/restore for a database with existing users/trips
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: coago-production-database-bootstrap
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == 'petchsnowa/coago-ride' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect or upgrade the pinned production database
        env:
          COAGO_DATABASE_TARGET: production
          COAGO_PROJECT_CONFIRMATION: ${{ inputs.project_confirmation }}
          COAGO_ADMIN_UPGRADE_OPERATION: ${{ inputs.operation }}
          COAGO_ALLOW_EXISTING_DATA: ${{ inputs.allow_existing_data }}
          COAGO_PRODUCTION_DATABASE_URL: ${{ secrets.COAGO_PRODUCTION_DATABASE_URL }}
          COAGO_PRODUCTION_DATABASE_HOST: ${{ vars.COAGO_PRODUCTION_DATABASE_HOST }}
          COAGO_PRODUCTION_DATABASE_NAME: ${{ vars.COAGO_PRODUCTION_DATABASE_NAME }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
        run: pnpm exec tsx scripts/production/admin-upgrade-cli.ts
