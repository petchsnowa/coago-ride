name: Remote Hyperdrive test
on:
  workflow_dispatch:
  push:
    branches: [codex/phase-1-foundation]
    paths:
      - .github/workflows/remote-hyperdrive.yml
      - scripts/remote/**
permissions:
  contents: read
concurrency:
  group: coago-remote-hyperdrive
  cancel-in-progress: false
jobs:
  remote:
    if: github.repository == 'petchsnowa/coago-ride'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test remote Workers preview through temporary Hyperdrive
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COAGO_TEST_DATABASE_URL: ${{ secrets.COAGO_TEST_DATABASE_URL }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec tsx scripts/remote/hyperdrive.ts run
      - name: Delete and verify temporary Hyperdrive configuration
        if: always()
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec tsx scripts/remote/hyperdrive.ts cleanup
