services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: coago_test
      POSTGRES_PASSWORD: coago_test
      POSTGRES_DB: coago_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coago_test -d coago_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
